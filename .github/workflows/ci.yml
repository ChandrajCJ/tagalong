name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: tagalong
          POSTGRES_PASSWORD: tagalong
          POSTGRES_DB: tagalong_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U tagalong -d tagalong_test"
          --health-interval 5s --health-timeout 3s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 20
    env:
      NODE_ENV: test
      DATABASE_URL: postgres://tagalong:tagalong@localhost:5432/tagalong_test
      TEST_DATABASE_URL: postgres://tagalong:tagalong@localhost:5432/tagalong_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-secret-that-is-long-enough-for-tests
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm --filter @tagalong/db db:migrate:test
      - run: pnpm test
