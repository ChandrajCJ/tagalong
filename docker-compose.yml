services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: tagalong
      POSTGRES_PASSWORD: tagalong
      POSTGRES_DB: tagalong
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U tagalong -d tagalong']
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379' # 6380 on the host so it doesn't clash with a local Redis
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20

  # S3-compatible object storage for documents and, later, photos.
  # SeaweedFS rather than MinIO: MinIO's public images are no longer pullable.
  storage:
    image: chrislusf/seaweedfs:3.68
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    ports:
      - '8333:8333' # the S3 API
    volumes:
      - storagedata:/data
      - ./infra/seaweedfs/s3.json:/etc/seaweedfs/s3.json:ro
    healthcheck:
      # The S3 port answers 403 to an unsigned request (which is correct), so
      # health is taken from the master's status endpoint instead.
      test: ['CMD-SHELL', 'wget -q -O - "http://$$(hostname):9333/cluster/status"']
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
  storagedata:
